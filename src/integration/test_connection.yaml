---
- name: Test Connection to Target System
  hosts: localhost
  gather_facts: no

  tasks:
    # Configuration is passed directly via --extra-vars by GCM
    # For test_connection, GCM flattens the integration config to root level
    # All fields are available as top-level variables
    - name: Initialize variables
      set_fact:
        out_dir: "{{ out_dir }}"
        status_file: "{{ out_dir }}/{{ status_file_name }}"

    - name: Create output directory
      file:
        path: "{{ out_dir }}"
        state: directory
        mode: '0755'

    - name: Test connection
      block:
        - name: Initialize status
          copy:
            content: |
              {
                "runId": "{{ run_id }}",
                "action": "{{ action }}",
                "status": "InProgress",
                "message": "Testing connection"
              }
            dest: "{{ status_file }}"

        # Test IBM Concert API connectivity by listing environments
        - name: Test IBM Concert API connectivity
          uri:
            url: "{{ server_url }}/core/api/v1/environments?page_size=1"
            method: GET
            headers:
              Authorization: "C_API_KEY {{ api_key }}"
              InstanceId: "{{ instance_id }}"
              Accept: "application/json"
            validate_certs: "{{ (verify_ssl | default('true')) == 'true' }}"
            status_code: [200]
          register: api_response
          no_log: true

        - name: Update status - Success
          copy:
            content: |
              {
                "runId": "{{ run_id }}",
                "action": "{{ action }}",
                "status": "Success",
                "message": "Connection successful"
              }
            dest: "{{ status_file }}"

      rescue:
        - name: Update status - Failed
          copy:
            content: |
              {
                "runId": "{{ run_id }}",
                "action": "{{ action }}",
                "status": "Failed",
                "message": "Connection failed: {{ ansible_failed_result.msg | default('Unknown error') }}"
              }
            dest: "{{ status_file }}"

        - name: Fail the playbook
          fail:
            msg: "Connection test failed"


