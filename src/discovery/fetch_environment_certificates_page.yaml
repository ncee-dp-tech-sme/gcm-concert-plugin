---
# Changelog:
# Fri Sep 11 21:39:05 CEST 2026 - v2.0.1: Created as pagination page helper.
# Sat Sep 12 00:15:23 CEST 2026 - v2.0.2: Added when: has_more_pages | bool to every
#   task so the guard is re-evaluated per iteration.
# (fix/timeout-pagination) - v2.1.0: Simplified. This file is now only called for pages 2+
#   (page 1 is fetched inline by fetch_environment_certificates.yaml). Removed has_more_pages
#   guard — the caller loop range(2, cert_total_pages+1) already ensures correct iteration
#   count. Renamed register variable to avoid collisions with the access points helper.

# Helper file to fetch a single additional page (page 2+) of certificates for an environment.
# Included by fetch_environment_certificates.yaml with loop_var: cert_page_num.
# Only called when cert_total_pages > 1 (already determined from page 1 response).

- name: Fetch certificate page {{ cert_page_num }}
  uri:
    url: "{{ instance.server_url }}/core/api/v1/certificates?environment_id={{ concert_environment.id }}&page_size=2000&page_number={{ cert_page_num }}"
    method: GET
    headers:
      Authorization: "C_API_KEY {{ instance.api_key }}"
      InstanceId: "{{ instance.instance_id }}"
      Accept: "application/json"
    validate_certs: "{{ (instance.verify_ssl | default('true')) == 'true' }}"
    status_code: [200]
    timeout: 60
  register: cert_page_response
  no_log: true

- name: Append certificates from page {{ cert_page_num }}
  set_fact:
    environment_certificates: "{{ environment_certificates + (cert_page_response.json.certificates | default([])) }}"
