---
# Changelog:
# Fri Sep 11 20:25:19 CEST 2026 - v2.0.0: Created for Concert 3.0+ /environments/{id}/access_points.
# Fri Sep 11 21:39:05 CEST 2026 - v2.0.1: Fixed infinite-loop bug, switched to range(1,1001)
#   with page helper file.
# Sat Sep 12 00:15:23 CEST 2026 - v2.0.2: Added per-task when: guard in page helper to avoid
#   evaluating skipped tasks.
# (fix/timeout-pagination) - v2.1.0: Rewrote pagination to eliminate range(1,1001) 1000-
#   iteration loop that caused GCM discovery timeouts. New approach: fetch page 1 first to
#   learn total_pages, then loop only over remaining pages (range(2, total_pages+1)), which
#   may be 0 iterations for environments with few access points. Also added uri timeout: 60
#   to prevent hung HTTP calls. Removed dependency on fetch_application_access_points_page.yaml.

# Helper file to fetch ALL access points for a single environment.
# Included by process_instance.yaml with loop_var: concert_environment.
# Access environment data via {{ concert_environment.id }}, {{ concert_environment.name }}.
#
# Concert 3.0+ API: /core/api/v1/environments/{id}/access_points
# Response includes environment_id and environment_name directly on each access point.

- name: Fetch access points for environment {{ concert_environment.name | default(concert_environment.id) }}
  block:
    - name: Initialize access point accumulator
      set_fact:
        environment_access_points: []

    # Fetch page 1 first so we know the total number of pages before looping.
    - name: Fetch access point page 1
      uri:
        url: "{{ instance.server_url }}/core/api/v1/environments/{{ concert_environment.id }}/access_points?page_number=1&page_size=100&sort_by=name&sort_direction=ASC"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ instance.api_key }}"
          InstanceId: "{{ instance.instance_id }}"
          Accept: "application/json"
        validate_certs: "{{ (instance.verify_ssl | default('true')) == 'true' }}"
        status_code: [200]
        timeout: 60
      register: ap_page1_response
      no_log: true

    - name: Extract page 1 access points and total page count
      set_fact:
        environment_access_points: "{{ ap_page1_response.json.access_points | default([]) }}"
        ap_total_pages: "{{ ap_page1_response.json.pagination.total_pages | default(1) | int }}"

    # Only loop if there are additional pages beyond page 1.
    # range(2, ap_total_pages+1) produces an empty list when ap_total_pages == 1,
    # so this block executes 0 times for environments with ≤100 access points.
    - name: Fetch remaining access point pages (pages 2..{{ ap_total_pages }})
      include_tasks: fetch_application_access_points_page.yaml
      loop: "{{ range(2, ap_total_pages | int + 1) | list }}"
      loop_control:
        loop_var: ap_page_num
      when: ap_total_pages | int > 1

    # Concert 3.0 API: environment_id and environment_name are already present in each
    # access point object. We only add environment_type which is not in the API response.
    - name: Enrich access points with environment type
      set_fact:
        enriched_access_points: >-
          {{
            environment_access_points | map('combine', {
              'environment_type': concert_environment.type | default('')
            }) | list
          }}

    - name: Write IT asset output files
      copy:
        content: "{{ access_point | to_nice_json }}"
        dest: "{{ out_dir }}/it_asset_details_{{ instance_index }}_{{ env_index }}_{{ access_point_index }}.json"
      loop: "{{ enriched_access_points }}"
      loop_control:
        loop_var: access_point
        index_var: access_point_index
      when: enriched_access_points | length > 0

    - name: Update IT asset counter
      set_fact:
        instance_it_asset_count: "{{ (instance_it_asset_count | int) + (enriched_access_points | length) }}"

  rescue:
    - name: Log access point fetch error
      debug:
        msg: "Failed to fetch access points for environment {{ concert_environment.id }}: {{ ansible_failed_result.msg | default('Unknown error') }}"

    - name: Continue with next environment despite error
      set_fact:
        instance_it_asset_count: "{{ instance_it_asset_count | int }}"
