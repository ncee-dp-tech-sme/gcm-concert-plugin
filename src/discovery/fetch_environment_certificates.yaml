---
# Changelog:
# Fri Sep 11 20:25:19 CEST 2026 - Initial version with recursive include_tasks pagination.
# Fri Sep 11 21:39:05 CEST 2026 - v2.0.1: Fixed infinite-loop bug, switched to range(1,1001)
#   with page helper file.
# Sat Sep 12 00:15:23 CEST 2026 - v2.0.2: Added per-task when: guard in page helper to avoid
#   evaluating skipped tasks.
# (fix/timeout-pagination) - v2.1.0: Rewrote pagination to eliminate range(1,1001) 1000-
#   iteration loop that caused GCM discovery timeouts. New approach: fetch page 1 first to
#   learn total_pages, then loop only over remaining pages (range(2, total_pages+1)), which
#   may be 0 iterations for single-page environments. Also added uri timeout: 60 to prevent
#   hung HTTP calls. Removed dependency on fetch_environment_certificates_page.yaml.

# Helper file to fetch ALL certificates for a single environment.
# Included by process_instance.yaml with loop_var: concert_environment.
# Access environment data via {{ concert_environment.id }}, {{ concert_environment.name }}.

- name: Fetch certificates for environment {{ concert_environment.name | default(concert_environment.id) }}
  block:
    - name: Initialize certificate accumulator
      set_fact:
        environment_certificates: []

    # Fetch page 1 first so we know the total number of pages before looping.
    # page_size=2000 keeps the number of pages low (most environments fit in 1 page).
    - name: Fetch certificate page 1
      uri:
        url: "{{ instance.server_url }}/core/api/v1/certificates?environment_id={{ concert_environment.id }}&page_size=2000&page_number=1"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ instance.api_key }}"
          InstanceId: "{{ instance.instance_id }}"
          Accept: "application/json"
        validate_certs: "{{ (instance.verify_ssl | default('true')) == 'true' }}"
        status_code: [200]
        timeout: 60
      register: cert_page1_response
      no_log: true

    - name: Extract page 1 certificates and total page count
      set_fact:
        environment_certificates: "{{ cert_page1_response.json.certificates | default([]) }}"
        cert_total_pages: "{{ cert_page1_response.json.pagination.total_pages | default(1) | int }}"

    # Only loop if there are additional pages beyond page 1.
    # range(2, cert_total_pages+1) produces an empty list when cert_total_pages == 1,
    # so this block executes 0 times for single-page environments.
    - name: Fetch remaining certificate pages (pages 2..{{ cert_total_pages }})
      include_tasks: fetch_environment_certificates_page.yaml
      loop: "{{ range(2, cert_total_pages | int + 1) | list }}"
      loop_control:
        loop_var: cert_page_num
      when: cert_total_pages | int > 1

    - name: Enrich certificates with environment context
      set_fact:
        enriched_certificates: >-
          {{
            environment_certificates | map('combine', {
              'environment_id': concert_environment.id,
              'environment_name': concert_environment.name | default(''),
              'environment_type': concert_environment.type | default(''),
              'environment_status': concert_environment.status | default('')
            }) | list
          }}

    - name: Write certificate output files
      copy:
        content: "{{ cert | to_nice_json }}"
        dest: "{{ out_dir }}/crypto_asset_details_{{ instance_index }}_{{ env_index }}_{{ cert_index }}.json"
      loop: "{{ enriched_certificates }}"
      loop_control:
        loop_var: cert
        index_var: cert_index
      when: enriched_certificates | length > 0

    - name: Update instance asset counter
      set_fact:
        instance_asset_count: "{{ (instance_asset_count | int) + (enriched_certificates | length) }}"

  rescue:
    - name: Log certificate fetch error for environment
      debug:
        msg: "Failed to fetch certificates for environment {{ concert_environment.id }}: {{ ansible_failed_result.msg | default('Unknown error') }}"

    - name: Continue with next environment despite error
      set_fact:
        instance_asset_count: "{{ instance_asset_count | int }}"

# Made with Bob
