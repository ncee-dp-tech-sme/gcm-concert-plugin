    #   uri:
    #     url: "{{ instance.url }}/api/certificates"
    #     method: GET
    #     headers:
    #       Authorization: "Bearer {{ instance.apiKey }}"
    #     validate_certs: "{{ instance.verifySsl | default(true) }}"
