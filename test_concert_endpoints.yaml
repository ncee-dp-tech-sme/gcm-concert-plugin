---
- name: Comprehensive IBM Concert API Exploration
  hosts: localhost
  gather_facts: no

  vars:
    server_url: "https://65879.us-south-8.concert.saas.ibm.com"
    api_key: "ZXJ3aW4uZnJpZXRob2ZmQG5sLmlibS5jb206YzMwYWZmNWUtMzM1Zi00ZTIwLTgyMzgtYzU4ZDc5ZmEzOWMx"
    instance_id: "20240826-1930-2047-8140-78cf45ec64dc"

  tasks:
    - name: Get first environment
      uri:
        url: "{{ server_url }}/core/api/v1/environments?page_size=1"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ api_key }}"
          InstanceId: "{{ instance_id }}"
          Accept: "application/json"
        validate_certs: true
        status_code: [200]
      register: env_response

    - name: Set environment ID
      set_fact:
        env_id: "{{ env_response.json.environments[0].id }}"
        env_name: "{{ env_response.json.environments[0].name }}"

    - name: Test 1 - Try resources endpoint
      uri:
        url: "{{ server_url }}/core/api/v1/resources?environment_id={{ env_id }}&page_size=100"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ api_key }}"
          InstanceId: "{{ instance_id }}"
          Accept: "application/json"
        validate_certs: true
        status_code: [200, 404]
      register: resources_response
      ignore_errors: yes

    - name: Save resources response
      copy:
        content: "{{ resources_response.json | default({}) | to_nice_json }}"
        dest: "./test_resources_response.json"
      when: resources_response.status == 200

    - name: Test 2 - Get a certificate with full details
      uri:
        url: "{{ server_url }}/core/api/v1/certificates?environment_id={{ env_id }}&page_size=1"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ api_key }}"
          InstanceId: "{{ instance_id }}"
          Accept: "application/json"
        validate_certs: true
        status_code: [200]
      register: cert_response

    - name: Set certificate ID
      set_fact:
        cert_id: "{{ cert_response.json.certificates[0].id }}"
      when: cert_response.json.certificates | length > 0

    - name: Test 3 - Get single certificate details
      uri:
        url: "{{ server_url }}/core/api/v1/certificates/{{ cert_id }}"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ api_key }}"
          InstanceId: "{{ instance_id }}"
          Accept: "application/json"
        validate_certs: true
        status_code: [200]
      register: cert_detail_response
      when: cert_id is defined

    - name: Save certificate detail
      copy:
        content: "{{ cert_detail_response.json | to_nice_json }}"
        dest: "./test_certificate_detail.json"
      when: cert_detail_response is defined and cert_detail_response.status == 200

    - name: Test 4 - Try endpoints endpoint
      uri:
        url: "{{ server_url }}/core/api/v1/endpoints?environment_id={{ env_id }}&page_size=100"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ api_key }}"
          InstanceId: "{{ instance_id }}"
          Accept: "application/json"
        validate_certs: true
        status_code: [200, 404]
      register: endpoints_response
      ignore_errors: yes

    - name: Save endpoints response
      copy:
        content: "{{ endpoints_response.json | default({}) | to_nice_json }}"
        dest: "./test_endpoints_response.json"
      when: endpoints_response.status == 200

    - name: Test 5 - Try hosts endpoint
      uri:
        url: "{{ server_url }}/core/api/v1/hosts?environment_id={{ env_id }}&page_size=100"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ api_key }}"
          InstanceId: "{{ instance_id }}"
          Accept: "application/json"
        validate_certs: true
        status_code: [200, 404]
      register: hosts_response
      ignore_errors: yes

    - name: Save hosts response
      copy:
        content: "{{ hosts_response.json | default({}) | to_nice_json }}"
        dest: "./test_hosts_response.json"
      when: hosts_response.status == 200

    - name: Test 6 - Try services endpoint
      uri:
        url: "{{ server_url }}/core/api/v1/services?environment_id={{ env_id }}&page_size=100"
        method: GET
        headers:
          Authorization: "C_API_KEY {{ api_key }}"
          InstanceId: "{{ instance_id }}"
          Accept: "application/json"
        validate_certs: true
        status_code: [200, 404]
      register: services_response
      ignore_errors: yes

    - name: Save services response
      copy:
        content: "{{ services_response.json | default({}) | to_nice_json }}"
        dest: "./test_services_response.json"
      when: services_response.status == 200

    - name: Summary
      debug:
        msg: |
          API Exploration Results:
          - Environment: {{ env_name }} ({{ env_id }})
          - Resources endpoint: {{ 'SUCCESS' if resources_response.status == 200 else 'FAILED/NOT FOUND' }}
          - Certificate detail: {{ 'SUCCESS' if cert_detail_response is defined and cert_detail_response.status == 200 else 'SKIPPED' }}
          - Endpoints endpoint: {{ 'SUCCESS' if endpoints_response.status == 200 else 'FAILED/NOT FOUND' }}
          - Hosts endpoint: {{ 'SUCCESS' if hosts_response.status == 200 else 'FAILED/NOT FOUND' }}
          - Services endpoint: {{ 'SUCCESS' if services_response.status == 200 else 'FAILED/NOT FOUND' }}

# Made with Bob
